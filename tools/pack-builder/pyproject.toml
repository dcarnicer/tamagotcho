[project]
name = "tamagotcho-pack"
version = "0.3.0"
description = "Pack builder for Tamagotcho (たまごっちょ), a kanji flashcard app for the M5Stack StickS3"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.3",
    "fonttools>=4.50",
    "pypdf>=6.0",
]

[project.scripts]
tamagotcho-pack = "tamagotcho_pack.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamagotcho_pack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
