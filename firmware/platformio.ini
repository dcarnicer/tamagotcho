; Tamagotcho (たまごっちょ) firmware.
;   pio run -e sticks3 -t upload && pio run -e sticks3 -t uploadfs
;   pio test -e native
;
; Flash layout (see partitions/*.csv): one 2 MB app slot, no OTA, everything
; else is LittleFS. Packs are 2-3 MB each, so filesystem space matters more
; than an update slot; firmware is flashed over USB.

[platformio]
default_envs = sticks3
data_dir = data

; Every ESP32-S3 board. The flags that need PSRAM are in common_psram.
[common_esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; TGC_VERSION: $TGC_VERSION (the release tag in CI), else `git describe`, else
; "dev"; compiled into src/Version.cpp only (see the script).
extra_scripts = pre:scripts/version.py
build_flags =
    -std=gnu++17
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Isrc
build_unflags =
    -std=gnu++11

; Boards with octal PSRAM (StickS3, T-Display-S3).
[common_psram]
extends = common_esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; M5Stack StickS3: ESP32-S3-PICO-1-N8R8 (8 MB flash, 8 MB PSRAM), 135x240.
[env:sticks3]
extends = common_psram
board_upload.flash_size = 8MB
board_build.partitions = partitions/sticks3_8MB.csv
build_flags =
    ${common_psram.build_flags}
    -DTGC_BOARD_STICKS3
build_src_filter =
    +<*>
    -<board/BoardTDisplayS3.cpp>
    -<board/BoardCardputerAdv.cpp>
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#e125e73f28b6b83e621e48df432af426bb2ff935
    M5PM1=https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee

; StickS3 plus the quiz trace over serial (TGC_QUIZ_LOG): every question,
; answer, grade, detail card, Wi-Fi and power event.
;   pio run -e sticks3-dev -t upload && pio device monitor
[env:sticks3-dev]
extends = env:sticks3
build_flags =
    ${env:sticks3.build_flags}
    -DTGC_QUIZ_LOG=1

; StickS3 plus a serial remote (TGC_REMOTE): tools/screenshots presses the
; buttons and reads the screen back. Never for a release.
;   pio run -e sticks3-shots -t upload
[env:sticks3-shots]
extends = env:sticks3
build_flags =
    ${env:sticks3.build_flags}
    -DTGC_REMOTE=1

; StickS3 for the battery discharge test: stays awake on battery (no dim, no
; idle sleep) and appends every reading to /batt.log, printed over USB at boot
; and once a minute. The critical guard still sleeps at 3 %. Never for a
; release.
;   pio run -e sticks3-batt -t upload
[env:sticks3-batt]
extends = env:sticks3
build_flags =
    ${env:sticks3.build_flags}
    -DTGC_BATT_TEST=1

; LilyGO T-Display-S3 (ESP32-S3R8, 16 MB flash), 170x320 8-bit parallel ST7789.
[env:tdisplay-s3]
extends = common_psram
board_upload.flash_size = 16MB
board_build.partitions = partitions/tdisplay_s3_16MB.csv
build_flags =
    ${common_psram.build_flags}
    -DTGC_BOARD_TDISPLAY_S3
    -DLGFX_USE_V1
build_src_filter =
    +<*>
    -<board/BoardSticks3.cpp>
    -<board/BoardCardputerAdv.cpp>
lib_deps =
    lovyan03/LovyanGFX@^1.1.16

; T-Display-S3 plus the serial remote (TGC_REMOTE), as sticks3-shots. Never for
; a release.
;   pio run -e tdisplay-s3-shots -t upload
[env:tdisplay-s3-shots]
extends = env:tdisplay-s3
build_flags =
    ${env:tdisplay-s3.build_flags}
    -DTGC_REMOTE=1

; M5Stack Cardputer ADV: Stamp-S3A (ESP32-S3FN8: 8 MB flash, no PSRAM), 240x135
; landscape over a 56-key keyboard (TCA8418). No PSRAM: the quad-SPI build of
; the framework, no BOARD_HAS_PSRAM, and the packs' tables are read on demand
; (pack/PackReader.h, PackMemory::Streamed). The StickS3's 8 MB partitions.
;   pio run -e cardputer-adv -t upload
[env:cardputer-adv]
extends = common_esp32s3
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = partitions/sticks3_8MB.csv
build_flags =
    ${common_esp32s3.build_flags}
    -DTGC_BOARD_CARDPUTER_ADV
build_src_filter =
    +<*>
    -<board/BoardSticks3.cpp>
    -<board/BoardTDisplayS3.cpp>
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#e125e73f28b6b83e621e48df432af426bb2ff935

; The M5 image: the StickS3 and the Cardputer ADV in one build, the board
; chosen at boot (board/BoardM5.cpp), for one M5Burner entry. The StickS3's
; octal-PSRAM framework build: on the Cardputer the PSRAM init fails and the
; boot goes on, and the packs open streamed there as in cardputer-adv. Both
; boards have 8 MB of flash and use the same partitions.
;   pio run -e m5stack -t upload
[env:m5stack]
extends = common_psram
board_upload.flash_size = 8MB
board_build.partitions = partitions/sticks3_8MB.csv
build_flags =
    ${common_psram.build_flags}
    -DTGC_BOARD_M5
build_src_filter =
    +<*>
    -<board/BoardTDisplayS3.cpp>
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#e125e73f28b6b83e621e48df432af426bb2ff935
    M5PM1=https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee

; The M5 image plus the serial remote (TGC_REMOTE). Never for a release.
;   pio run -e m5stack-shots -t upload
[env:m5stack-shots]
extends = env:m5stack
build_flags =
    ${env:m5stack.build_flags}
    -DTGC_REMOTE=1

; Cardputer ADV plus the serial remote (TGC_REMOTE), as sticks3-shots: it
; presses G0, types the keys and reads the screen back. Never for a release.
;   pio run -e cardputer-adv-shots -t upload
[env:cardputer-adv-shots]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DTGC_REMOTE=1

; Host unit tests for the pure-C++ modules (pack/, quiz/, srs/ incl. time zones, imu/, catalog/, portal/,
; ota/, and ui/'s header-only list, theme, icon, UI font, quiz-screen and key-input code). No Arduino.
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc
build_src_filter =
    -<*>
    +<pack/>
    +<quiz/>
    +<srs/>
    +<imu/>
    +<catalog/>
    +<portal/>
    +<ota/>
test_filter = test_native, test_rle, test_srs, test_imu, test_catalog, test_portal, test_ota, test_tz, test_ui, test_quizui, test_settings, test_keys
