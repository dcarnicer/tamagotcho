name: Release

# Tags publish automatically. A manual run is for a dry run or for rebuilding a
# release without moving the tag. Firmware releases carry no packs: the decks
# live in their own `decks-v<pack format version>` release, published by
# decks.yml and never marked "latest" (docs/decisions.md, 2026-10-18).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, must start with 'v' (e.g. v0.2.0)"
        required: true
        type: string

# Releases are not cancelled by a newer run of the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; only the publish job asks for contents: write.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      decks_catalog: ${{ steps.decks.outputs.catalog }}
    steps:
      # Get decks reads the decks release named in the firmware's default
      # catalog URL (HomeWifi::kDefaultCatalogUrl); the notes link to that one.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: firmware/src/platform/HomeWifi.h
          sparse-checkout-cone-mode: false

      - id: decks
        run: |
          url="$(grep -oE 'https://github\.com/[^"]+/releases/download/decks-v[0-9]+/catalog\.txt' \
            firmware/src/platform/HomeWifi.h | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::warning::no decks-v<N> catalog URL in firmware/src/platform/HomeWifi.h"
          fi
          echo "catalog=$url" >> "$GITHUB_OUTPUT"
          echo "decks catalog: ${url:-none}"

      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ "$EVENT" != "workflow_dispatch" ]; then
            tag="$REF_NAME"
          fi
          case "$tag" in
            v*) ;;
            *) echo "error: release tag must start with 'v' (got '$tag')" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved release tag: $tag"

  firmware:
    name: Firmware (${{ matrix.name }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: sticks3
            name: StickS3
            partitions: sticks3_8MB.csv
            flash_size: 8MB
          - env: tdisplay-s3
            name: T-Display-S3
            partitions: tdisplay_s3_16MB.csv
            flash_size: 16MB
    defaults:
      run:
        working-directory: firmware
    # The firmware's version string (firmware/scripts/version.py): the release
    # tag, shown on the device (Settings > About), in the boot log and in the
    # portal's JSON. Without it the build would describe the shallow checkout,
    # which has no tags, as a bare commit id.
    env:
      TGC_VERSION: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install "platformio>=6.1,<7" "esptool>=4,<6"

      - name: PlatformIO version
        id: pio
        run: echo "version=$(pio --version | sed -E 's/[^0-9]*([0-9][0-9.]*).*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ steps.pio.outputs.version }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ steps.pio.outputs.version }}-

      - name: Build
        run: pio run -e ${{ matrix.env }}

      # scripts/version.py replaces any character outside [0-9A-Za-z._+~-], so
      # an odd tag would ship another string: fail instead.
      - name: Check the version string in the image
        env:
          ENVNAME: ${{ matrix.env }}
        run: |
          if ! strings ".pio/build/${ENVNAME}/firmware.bin" | grep -qF -- "$TGC_VERSION"; then
            echo "error: '$TGC_VERSION' is not in firmware.bin (see firmware/scripts/version.py)" >&2
            exit 1
          fi
          echo "firmware.bin carries version $TGC_VERSION"

      # App-only image (ESP image magic 0xE9, no bootloader/partition table):
      # what M5Launcher installs and what `pio run -t upload` writes to the app
      # slot. The merged image below is the one ESP Web Tools needs.
      - name: Stage app-only .bin
        run: |
          mkdir -p ../dist
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "../dist/tangocho-${{ matrix.env }}.bin"

      - name: Build merged flashable image (for ESP Web Tools)
        run: |
          mkdir -p ../dist
          boot_app0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions" \
            -name boot_app0.bin -print -quit 2>/dev/null || true)"
          extra=()
          if [ -n "$boot_app0" ]; then extra=(--boot-app0 "$boot_app0"); fi
          # merge_image.py shells out to the `esptool` CLI (installed above).
          python3 ../tools/release/merge_image.py \
            --build-dir ".pio/build/${{ matrix.env }}" \
            --partitions "partitions/${{ matrix.partitions }}" \
            --flash-size "${{ matrix.flash_size }}" \
            --out "../dist/tangocho-${{ matrix.env }}-merged.bin" \
            "${extra[@]}"

      - name: ESP Web Tools manifest
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          ENVNAME: ${{ matrix.env }}
          BOARDNAME: ${{ matrix.name }}
        run: |
          cat > "../dist/tangocho-${ENVNAME}-manifest.json" <<JSON
          {
            "name": "Tangochō ${BOARDNAME}",
            "version": "${TAG#v}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "tangocho-${ENVNAME}-merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [resolve, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        env:
          DECKS_CATALOG: ${{ needs.resolve.outputs.decks_catalog }}
        run: |
          tag="${{ needs.resolve.outputs.tag }}"
          {
          cat <<MD
          # Tangochō ${tag}

          Firmware for the **M5Stack StickS3** and the **LilyGO T-Display-S3**.

          ## Assets

          | file | what |
          |---|---|
          | \`tangocho-sticks3.bin\` | app-only image (M5Launcher, \`pio run -t upload\`) |
          | \`tangocho-tdisplay-s3.bin\` | app-only image (T-Display-S3) |
          | \`tangocho-sticks3-merged.bin\`, \`tangocho-tdisplay-s3-merged.bin\` | single images for a first install (offset 0x0) |
          | \`tangocho-*-manifest.json\` | ESP Web Tools manifests (for an install page) |

          ## Flash it

          - **First install, USB:** \`esptool --chip esp32s3 write_flash 0x0 tangocho-sticks3-merged.bin\`
          - **First install, browser** (Chrome or Edge): open
            <https://espressif.github.io/esptool-js/>, **Connect**, add
            \`tangocho-sticks3-merged.bin\` at address \`0x0\`, **Program**.
          - **Update:** \`esptool --chip esp32s3 write_flash 0x10000 tangocho-sticks3.bin\`.
            The merged image also erases the settings (home Wi-Fi, preferences);
            the app-only image keeps them. Decks and study progress survive both.
          - **M5Launcher:** install the app-only \`tangocho-sticks3.bin\`, then put a
            deck on the device over Wi-Fi (a device with no deck boots into the
            Wi-Fi upload screen).

          The StickS3 merged image was verified on a real device with esptool and
          from the browser (esptool-js, after Erase Flash); the T-Display-S3
          images are built but not verified on hardware (see docs/decisions.md).

          ## Decks

          Kanji decks are not attached to firmware releases.
          MD
          if [ -n "$DECKS_CATALOG" ]; then
            decks_tag="${DECKS_CATALOG%/catalog.txt}"
            decks_tag="${decks_tag##*/}"
            decks_page="${DECKS_CATALOG%/download/*}/tag/${decks_tag}"
            cat <<MD
          They live in the
          [\`${decks_tag}\`](${decks_page}) release, whose catalog this firmware's
          **Get decks** reads (Settings > Decks > + Get decks, over the home Wi-Fi):
          \`${DECKS_CATALOG}\`. To install one by hand, download a \`.tgc\`
          from that release and upload it from the device's Wi-Fi portal page
          (\`http://192.168.4.1\`). The decks are CC BY-SA; their attribution is in
          that release's notes.
          MD
          else
            cat <<'MD'
          They live in this repository's `decks-v<pack format>` release (see its
          Releases page), whose catalog Get decks reads. The decks are CC BY-SA;
          their attribution is in that release's notes.
          MD
          fi
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "Tangochō ${TAG}" --notes-file notes.md dist/*
          fi
