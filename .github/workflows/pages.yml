name: Publish install page

# The browser installer lives on GitHub Pages because ESP Web Tools fetches the
# manifest and the merged image with fetch(): GitHub release assets do not send
# CORS headers, so the page and the binaries must share an origin.
#
# GitHub Pages must be enabled once in Settings -> Pages -> Source: GitHub
# Actions. This workflow does not enable it: `enablement: true` needs admin
# rights and changes a repository setting, which is the maintainer's call.
#
# A release created with GITHUB_TOKEN does not reliably trigger
# `release: published`, so wait for the Release workflow to finish instead.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (default: the latest release, e.g. v0.4.2)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the install page
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::no release tag found: pass the tag input, or publish a release first"
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must start with 'v' (got '$tag')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publishing the install page for $tag"

      - name: Download the release's install assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site
          gh release download "${{ steps.release.outputs.tag }}" --dir site \
            --pattern '*-merged.bin' \
            --pattern '*-manifest.json' \
            --clobber
          ls -l site

      - name: Render the page
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 tools/install-page/render.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --out site/index.html \
            --assets site

      # Strict pass: no {{TOKEN}} may survive, and every manifest and fallback
      # download referenced by the page must be in the Pages artifact.
      - name: Check the rendered page
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 tools/install-page/render.py \
            --tag "$TAG" \
            --out site/index.html \
            --assets site \
            --check

      - name: Add the board images and disable Jekyll
        run: |
          cp docs/images/board-sticks3.png site/
          cp docs/images/board-cardputer.png site/
          cp docs/images/board-tdisplay.png site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
